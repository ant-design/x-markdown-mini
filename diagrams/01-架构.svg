<text x="111" y="123" text-anchor="middle" font-size="12" fill="#0958d9">parse(content)</text>
<text x="111" y="140" text-anchor="middle" font-size="10.5" fill="#597ef7">仅词法</text>
<rect x="195" y="104" width="143" height="46" rx="7" fill="#ffffff" stroke="#69a6ff" stroke-width="1.2"/>
<text x="266" y="123" text-anchor="middle" font-size="12" fill="#0958d9">render(props)</text>
<text x="266" y="140" text-anchor="middle" font-size="10.5" fill="#597ef7">Token 流式回调</text>
<rect x="350" y="104" width="144" height="46" rx="7" fill="#ffffff" stroke="#69a6ff" stroke-width="1.2"/>
<text x="422" y="123" text-anchor="middle" font-size="12" fill="#0958d9">renderNodes(props)</text>
<text x="422" y="140" text-anchor="middle" font-size="10.5" fill="#597ef7">→ MiniNode[]</text>
