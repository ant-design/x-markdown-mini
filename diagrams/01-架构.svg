<svg xmlns="http://www.w3.org/2000/svg" width="740" height="600" viewBox="0 0 740 600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><defs><style>@keyframes ge-flow{to{stroke-dashoffset:0}}</style></defs><rect x="0" y="0" width="740" height="600" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="700" fill="#141414">@ant-design/x-markdown-mini · 整体代码架构</text><text x="24" y="50" font-size="12.5" fill="#8c8c8c">入口 → 流式 → 解析 → 转换 → 渲染；唯一语义映射、无中间 IR；扩展不 fork 源码</text>

<!-- ===== Layer 1 入口层 (blue) ===== -->
<rect x="24" y="66" width="486" height="98" rx="14" fill="#eef5ff" stroke="#91caff" stroke-width="1.4"/>
