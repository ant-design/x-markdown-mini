<text x="267" y="238" text-anchor="middle" font-size="12" fill="#0958d9">StreamingProcessor：稳定块缓存 + 结尾补全（remend），仅流式路径启用</text>
<path d="M 267 256 L 267 264" fill="none" stroke="#1677ff" stroke-width="2.4" stroke-dasharray="8" style="animation:600ms linear 0s infinite ge-flow;stroke-dashoffset:16"/><path d="M 263 264 L 271 264 L 267 272 Z" fill="#1677ff"/>

