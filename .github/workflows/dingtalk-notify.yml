name: DingTalk Notify

# Pushes issue / PR / release events to the maintainers' DingTalk group.
# Secrets: DINGTALK_WEBHOOK (robot URL with access_token) and DINGTALK_SECRET (加签 secret).
#
# `pull_request_target` (not `pull_request`) so fork PRs can read the secrets. It runs in
# the base-branch context and checks out the base ref only — PR code is never executed.
# A release is announced on a `v*` tag push (step 3 of the release flow in CLAUDE.md);
# npm publish itself is local, so the tag is the only event GitHub sees.
on:
  issues:
    types: [opened, closed, reopened]
  pull_request_target:
    types: [opened, closed, reopened]
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Send to DingTalk
        run: node .github/scripts/dingtalk-notify.mjs
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
