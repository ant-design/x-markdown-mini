name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --run

      # The pushed tag (vX.Y.Z) must match the version prepare-publish baked into
      # dist/package.json, or we'd publish a mislabeled release. Fail loudly.
      - name: Verify tag matches dist version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./dist/package.json').version")
          echo "tag=$TAG dist=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match dist/package.json version $PKG"
            exit 1
          fi

      # Publish-from-dist: the package root is the dist/ CONTENTS (es/, plugins/,
      # index.js, miniprogram_dist/ …, no dist/ segment), matching the local
      # `npm run release`. Publishing from the repo root would ship the old
      # dist/-nested layout via files:["dist"] — do NOT do that.
      - name: Publish
        run: npm publish ./dist --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
